<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Борщ — смачна гордість України</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFF6E9;
    --beet:#A0293F;
    --beet-dark:#6E1B2C;
    --wheat:#E8B84B;
    --dill:#4A7C59;
    --plum:#3B1D28;
    --paper:#FFFFFF;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    background:
      radial-gradient(circle at 15% 10%, #FFE8C2 0%, transparent 40%),
      radial-gradient(circle at 85% 90%, #F6D9DE 0%, transparent 45%),
      var(--cream);
    font-family:'Nunito', sans-serif;
    color:var(--plum);
    display:flex;
    justify-content:center;
    padding:32px 16px 64px;
  }

  .page{
    max-width:720px;
    width:100%;
  }

  /* ---- HERO ---- */
  .hero{
    text-align:center;
    margin-bottom:8px;
    position:relative;
  }

  .bowl-wrap{
    width:180px;
    margin:0 auto;
    position:relative;
    animation: pop .8s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes pop{
    0%{transform:scale(0); opacity:0;}
    70%{transform:scale(1.06); opacity:1;}
    100%{transform:scale(1);}
  }

  .steam-svg{
    position:absolute;
    top:-30px;
    left:50%;
    transform:translateX(-50%);
    width:70px;
  }
  .steam-svg path{
    stroke:#ffffff;
    stroke-width:4;
    stroke-linecap:round;
    fill:none;
    opacity:0;
    animation: rise 3s ease-in-out infinite;
  }
  .steam-svg path:nth-child(2){animation-delay:.6s;}
  .steam-svg path:nth-child(3){animation-delay:1.2s;}
  @keyframes rise{
    0%{opacity:0; transform:translateY(6px);}
    35%{opacity:.8;}
    100%{opacity:0; transform:translateY(-16px);}
  }

  h1{
    font-family:'Fredoka', sans-serif;
    font-size:clamp(2.1rem, 8vw, 2.8rem);
    color:var(--beet-dark);
    margin:6px 0 4px;
    opacity:0;
    animation: dropIn .7s .5s cubic-bezier(.34,1.56,.64,1) forwards;
  }
  .subtitle{
    font-size:1.05rem;
    color:var(--dill);
    font-weight:700;
    opacity:0;
    animation: dropIn .7s .8s cubic-bezier(.34,1.56,.64,1) forwards;
    margin-bottom:24px;
  }
  @keyframes dropIn{
    0%{transform:translateY(-14px); opacity:0;}
    100%{transform:translateY(0); opacity:1;}
  }

  /* ---- INGREDIENTS STRIP ---- */
  .ingredients{
    display:flex;
    justify-content:center;
    gap:18px;
    flex-wrap:wrap;
    margin-bottom:30px;
  }
  .ingredient{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    animation: bob 3.2s ease-in-out infinite;
  }
  .ingredient svg{
    width:52px;
    height:52px;
    filter: drop-shadow(0 4px 4px rgba(110,27,44,.15));
  }
  .ingredient span{
    font-size:.78rem;
    font-weight:700;
    color:var(--beet-dark);
  }
  .ingredient:nth-child(1){animation-delay:0s;}
  .ingredient:nth-child(2){animation-delay:.4s;}
  .ingredient:nth-child(3){animation-delay:.8s;}
  .ingredient:nth-child(4){animation-delay:1.2s;}
  .ingredient:nth-child(5){animation-delay:1.6s;}
  @keyframes bob{
    0%, 100%{transform:translateY(0) rotate(0deg);}
    50%{transform:translateY(-9px) rotate(-4deg);}
  }

  /* ---- STORY TEXT (animated word reveal) ---- */
  .story{
    background:var(--paper);
    border-radius:22px;
    padding:26px 24px;
    box-shadow:0 8px 24px rgba(110,27,44,.12);
    margin-bottom:32px;
  }
  .story p{
    font-size:1.14rem;
    line-height:1.9;
    margin:0 0 16px;
  }
  .story p:last-child{margin-bottom:0;}

  .word{
    display:inline-block;
    opacity:0;
    filter:blur(3px);
    transform:translateY(6px);
    animation: appear .5s ease forwards;
    margin-right:0.28em;
  }
  @keyframes appear{
    to{opacity:1; filter:blur(0); transform:translateY(0);}
  }

  .highlight{
    color:var(--beet);
    font-weight:800;
  }

  /* ---- QUIZ ---- */
  .quiz-title{
    font-family:'Fredoka', sans-serif;
    font-size:1.5rem;
    text-align:center;
    color:var(--beet-dark);
    margin-bottom:18px;
  }

  .question{
    background:var(--paper);
    border-radius:18px;
    padding:18px 20px;
    margin-bottom:16px;
    box-shadow:0 6px 16px rgba(110,27,44,.10);
  }
  .question p.q{
    font-weight:800;
    font-size:1.05rem;
    margin:0 0 12px;
  }
  .options{
    display:grid;
    gap:9px;
  }
  .opt{
    text-align:left;
    border:2px solid #F0DCC4;
    background:#FFFCF6;
    border-radius:12px;
    padding:10px 14px;
    font-family:'Nunito', sans-serif;
    font-size:1rem;
    font-weight:700;
    color:var(--plum);
    cursor:pointer;
    transition: border-color .15s, transform .1s;
  }
  .opt:hover{border-color:var(--wheat);}
  .opt:active{transform:scale(.98);}
  .opt.correct{
    background:#E7F3EA;
    border-color:var(--dill);
    color:var(--dill);
  }
  .opt.wrong{
    background:#FBE7E9;
    border-color:var(--beet);
    color:var(--beet);
  }
  .opt[disabled]{cursor:default;}

  .feedback{
    margin-top:10px;
    font-weight:700;
    min-height:22px;
    font-size:.98rem;
  }

  .score-wrap{
    text-align:center;
    margin-top:6px;
    font-family:'Fredoka', sans-serif;
    font-size:1.15rem;
    color:var(--beet-dark);
  }

  @media (prefers-reduced-motion: reduce){
    .word, h1, .subtitle, .bowl-wrap, .steam-svg path, .ingredient{animation:none !important; opacity:1 !important; filter:none !important; transform:none !important;}
  }
</style>
</head>
<body>
<div class="page">

  <div class="hero">
    <div class="bowl-wrap">
      <svg class="steam-svg" viewBox="0 0 70 40">
        <path d="M15 40 C 10 30, 20 25, 15 15" />
        <path d="M35 40 C 30 28, 42 24, 35 12" />
        <path d="M55 40 C 50 30, 60 25, 55 15" />
      </svg>
      <svg viewBox="0 0 200 180" width="180" height="162">
        <!-- shadow under bowl -->
        <ellipse cx="100" cy="158" rx="72" ry="10" fill="#000000" opacity="0.08"/>
        <!-- outer bowl body (deep, rounded) -->
        <path d="M18 78
                 C 18 74, 182 74, 182 78
                 C 182 78, 178 132, 150 148
                 C 128 160, 72 160, 50 148
                 C 22 132, 18 78, 18 78 Z"
              fill="#FDFBF6"/>
        <path d="M18 78
                 C 18 74, 182 74, 182 78
                 C 182 78, 178 132, 150 148
                 C 128 160, 72 160, 50 148
                 C 22 132, 18 78, 18 78 Z"
              fill="url(#bowlShade)"/>
        <defs>
          <linearGradient id="bowlShade" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.0"/>
            <stop offset="100%" stop-color="#D9CFBB" stop-opacity="0.55"/>
          </linearGradient>
          <radialGradient id="soupShade" cx="45%" cy="35%" r="65%">
            <stop offset="0%" stop-color="#D33A54"/>
            <stop offset="70%" stop-color="#A0293F"/>
            <stop offset="100%" stop-color="#7C1B33"/>
          </radialGradient>
        </defs>
        <!-- inner rim (thickness of the bowl wall) -->
        <ellipse cx="100" cy="78" rx="82" ry="20" fill="#EFE8DA"/>
        <!-- soup, deep inside the bowl -->
        <ellipse cx="100" cy="80" rx="72" ry="16" fill="url(#soupShade)"/>
        <!-- soup surface highlight -->
        <ellipse cx="100" cy="77" rx="72" ry="15" fill="#C42C48" opacity="0.35"/>
        <!-- outer rim highlight -->
        <ellipse cx="100" cy="74" rx="82" ry="18" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.7"/>
        <!-- sour cream swirl -->
        <path d="M62 76 C 78 68, 96 86, 112 72 C 122 64, 132 72, 140 68" stroke="#FFF8EC" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.9"/>
        <!-- dill flecks -->
        <circle cx="80" cy="78" r="2.2" fill="#4A7C59"/>
        <circle cx="118" cy="82" r="2" fill="#4A7C59"/>
        <circle cx="95" cy="72" r="1.8" fill="#4A7C59"/>
        <circle cx="130" cy="76" r="2" fill="#4A7C59"/>
        <circle cx="70" cy="70" r="1.8" fill="#4A7C59"/>
        <!-- beet piece -->
        <ellipse cx="105" cy="78" rx="7" ry="5" fill="#7C1B33"/>
        <!-- spoon resting on the rim -->
        <g transform="rotate(30 148 40)">
          <ellipse cx="148" cy="32" rx="10" ry="14" fill="#D8D8D8"/>
          <rect x="145" y="40" width="6" height="60" rx="3" fill="#D8D8D8"/>
        </g>
      </svg>
    </div>
    <h1>Борщ</h1>
    <div class="subtitle">страва, яку знає весь світ</div>
  </div>

  <div class="ingredients">
    <div class="ingredient">
      <svg viewBox="0 0 64 64"><ellipse cx="32" cy="34" rx="20" ry="22" fill="#8A1B33"/><ellipse cx="26" cy="26" rx="6" ry="8" fill="#B23A52" opacity="0.6"/><path d="M32 12 C 30 4, 38 4, 36 12 M32 12 C 34 3, 26 2, 28 10" stroke="#4A7C59" stroke-width="3" fill="none" stroke-linecap="round"/></svg>
      <span>Буряк</span>
    </div>
    <div class="ingredient">
      <svg viewBox="0 0 64 64"><circle cx="32" cy="34" r="22" fill="#8FBF6B"/><path d="M32 12 C 20 16, 16 30, 22 40" stroke="#6FA24D" stroke-width="3" fill="none"/><path d="M32 12 C 44 16, 48 30, 42 40" stroke="#6FA24D" stroke-width="3" fill="none"/><circle cx="32" cy="34" r="22" fill="none" stroke="#6FA24D" stroke-width="2" opacity="0.5"/></svg>
      <span>Капуста</span>
    </div>
    <div class="ingredient">
      <svg viewBox="0 0 64 64"><ellipse cx="32" cy="36" rx="19" ry="16" fill="#E0C08C"/><circle cx="24" cy="32" r="2" fill="#A9885A"/><circle cx="38" cy="40" r="2" fill="#A9885A"/><circle cx="32" cy="28" r="1.6" fill="#A9885A"/></svg>
      <span>Картопля</span>
    </div>
    <div class="ingredient">
      <svg viewBox="0 0 64 64"><path d="M32 50 C 20 46, 18 24, 32 14 C 46 24, 44 46, 32 50 Z" fill="#EF8B2C"/><path d="M32 14 L 30 4 M32 14 L 35 5" stroke="#4A7C59" stroke-width="3" stroke-linecap="round"/></svg>
      <span>Морква</span>
    </div>
    <div class="ingredient">
      <svg viewBox="0 0 64 64"><ellipse cx="32" cy="36" rx="18" ry="20" fill="#E8D7C3"/><path d="M32 16 L 32 8" stroke="#C7A96E" stroke-width="3" stroke-linecap="round"/><path d="M18 30 C 24 26, 40 26, 46 30" stroke="#C7A96E" stroke-width="2" fill="none" opacity="0.7"/><path d="M18 42 C 24 46, 40 46, 46 42" stroke="#C7A96E" stroke-width="2" fill="none" opacity="0.7"/></svg>
      <span>Цибуля</span>
    </div>
  </div>

  <div class="story" id="story"></div>

  <div class="quiz-title">Перевір себе! 🥄</div>
  <div id="quiz"></div>
  <div class="score-wrap" id="score"></div>

</div>

<script>
const paragraphs = [
  "Борщ — це червоний суп, який варять майже в кожній українській родині. Головний овоч у борщі — <b class='highlight'>буряк</b>. Саме він фарбує суп у яскраво-червоний колір.",
  "У 2022 році весь світ визнав борщ особливим скарбом. ЮНЕСКО внесло <b class='highlight'>українську борщову культуру</b> до списку, який захищає найважливіші традиції людства.",
  "Кожна господиня варить борщ трохи по-своєму: додає квасолю, гриби чи пампушки з часником. Але одне лишається незмінним — борщ їдять із хлібом, і від нього стає тепло й затишно."
];

const storyEl = document.getElementById('story');
let globalDelay = 0;

paragraphs.forEach((text) => {
  const p = document.createElement('p');
  const tokens = text.split(/(<b class='highlight'>.*?<\/b>|\s+)/g).filter(t => t && t.trim() !== '');
  tokens.forEach(tok => {
    const span = document.createElement('span');
    span.className = 'word';
    span.style.animationDelay = globalDelay + 's';
    span.innerHTML = tok;
    p.appendChild(span);
    globalDelay += 0.045;
  });
  globalDelay += 0.2;
  storyEl.appendChild(p);
});

// ---- QUIZ ----
const questions = [
  {
    q: "Який овоч робить борщ червоним?",
    options: ["Морква", "Буряк", "Капуста"],
    correct: 1,
    explain: "Правильно! Саме буряк дає борщу яскравий червоний колір."
  },
  {
    q: "Яка організація визнала українську борщову культуру скарбом людства?",
    options: ["ООН", "ЮНЕСКО", "Червоний Хрест"],
    correct: 1,
    explain: "Так, у 2022 році це зробило ЮНЕСКО."
  },
  {
    q: "З чим українці найчастіше їдять борщ?",
    options: ["З рисом", "З хлібом", "З гречкою"],
    correct: 1,
    explain: "Вірно — борщ смакує найкраще з хлібом чи пампушками."
  },
  {
    q: "У якому році ЮНЕСКО визнало борщову культуру скарбом?",
    options: ["2010", "2022", "2015"],
    correct: 1,
    explain: "Так, це сталося у 2022 році."
  },
  {
    q: "Що можуть додавати до борщу деякі господині?",
    options: ["Квасолю, гриби чи пампушки", "Рис і кукурудзу", "М'ясо птиці й горіхи"],
    correct: 0,
    explain: "Правильно! У кожної родини свій рецепт борщу."
  },
  {
    q: "Що саме захищає список ЮНЕСКО, до якого внесли борщ?",
    options: ["Найшвидші потяги світу", "Найважливіші традиції людства", "Найбільші міста світу"],
    correct: 1,
    explain: "Вірно — цей список зберігає важливі культурні традиції."
  },
  {
    q: "Яким стає настрій, коли їси борщ, за словами тексту?",
    options: ["Сумним", "Теплим і затишним", "Тривожним"],
    correct: 1,
    explain: "Так, борщ дарує тепло й затишок."
  }
];

const quizEl = document.getElementById('quiz');
const scoreEl = document.getElementById('score');
let score = 0;
let answered = 0;

questions.forEach((item, qi) => {
  const box = document.createElement('div');
  box.className = 'question';

  const qp = document.createElement('p');
  qp.className = 'q';
  qp.textContent = (qi+1) + ". " + item.q;
  box.appendChild(qp);

  const optsWrap = document.createElement('div');
  optsWrap.className = 'options';

  const feedback = document.createElement('div');
  feedback.className = 'feedback';

  item.options.forEach((optText, oi) => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.textContent = optText;
    btn.addEventListener('click', () => {
      const buttons = optsWrap.querySelectorAll('.opt');
      buttons.forEach(b => b.disabled = true);

      if(oi === item.correct){
        btn.classList.add('correct');
        feedback.style.color = 'var(--dill)';
        feedback.textContent = "✅ " + item.explain;
        score++;
      } else {
        btn.classList.add('wrong');
        buttons[item.correct].classList.add('correct');
        feedback.style.color = 'var(--beet)';
        feedback.textContent = "❌ " + item.explain;
      }
      answered++;
      if(answered === questions.length){
        scoreEl.textContent = "Твій результат: " + score + " із " + questions.length + " 🎉";
      }
    });
    optsWrap.appendChild(btn);
  });

  box.appendChild(optsWrap);
  box.appendChild(feedback);
  quizEl.appendChild(box);
});
</script>
</body>
</html>
